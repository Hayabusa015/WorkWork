<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- SHULL OS font substitution. See SHULL-CHG-0006.

       Trade Gothic Next is the brand primary and is Monotype-licensed, so it is
       never present in a build container and must never be committed to this
       repository. A .docx or .pptx correctly names it, and resolves to the real
       font on Matt's own machine.

       Without this file, a container render of that same document silently
       becomes DejaVu Sans - which is how every QA pass to date ended up
       inspecting different metrics than the shipped document. These aliases make
       the QA render and the classroom copy the same artifact. -->
  <alias binding="strong">
    <family>Trade Gothic Next</family>
    <accept><family>Archivo</family></accept>
  </alias>
  <alias binding="strong">
    <family>Trade Gothic Next Condensed</family>
    <accept><family>Archivo Narrow</family></accept>
  </alias>
  <alias binding="strong">
    <family>Trade Gothic Next Bold Condensed</family>
    <accept><family>Archivo Narrow</family></accept>
  </alias>
</fontconfig>
