# Run the SHULL OS validators and the app tests on every push and pull request.
#
# The Stop hook (scripts/hook-validate.sh) runs the same checks at the end of a
# Claude session, but it reports and never blocks, and it only runs when a
# session does. This runs them on every push, whoever made it, and shows a red
# mark on the commit when one fails.
#
# The list of checks is the hook's own list. If a validator is added there, add
# it here too.

name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Only what the validators import. The full build toolchain (LibreOffice,
      # poppler, pptxgenjs) is not needed to validate, only to render.
      - name: Install Python libraries
        run: >
          python -m pip install --quiet --disable-pip-version-check
          python-docx python-pptx pymupdf pillow weasyprint fonttools jsonschema numpy

      - name: Validators
        run: |
          fail=0
          for v in validate_layers validate_codes validate_tokens validate_agents \
                   validate_schemas validate_references validate_profiles validate_notes; do
            echo "::group::$v"
            python scripts/$v.py || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Generated files match the tokens
        run: |
          fail=0
          for c in measure_tokens build_slide_tokens build_app_css; do
            echo "::group::$c --check"
            python scripts/$c.py --check || fail=1
            echo "::endgroup::"
          done
          exit $fail

      # The tests use Node's built-in runner and no installed packages, so there
      # is no npm install step.
      - name: App and desktop tests
        run: npm test
