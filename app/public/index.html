<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHULL OS • Teaching workspace</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tokens.generated.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<aside>
  <a class="brand" href="/">SHULL <span>OS</span></a>
  <p class="tagline">Plan. Create. Teach.</p>
  <nav id="nav"></nav>
  <footer>
    Better lessons.<br>Brighter thinkers.
    <div class="line"></div>
    <small>Personal teaching workspace</small>
  </footer>
</aside>

<main>
  <header>
    <div><h1 id="heading">Today</h1><p id="subtitle">Your teaching day, in one place.</p></div>
    <div class="header-right"><span id="date"></span><span class="avatar" aria-label="Shull profile">S</span></div>
  </header>
  <div id="notice" role="status"></div>
  <div id="content"></div>
</main>

<dialog id="review">
  <button id="close" class="close" aria-label="Close review">×</button>
  <div id="detail"></div>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
